<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Crush</title>
    <link rel="stylesheet" href="candy.css">
    <script src="candy.js" defer></script>
</head>

<body>
    <div id="comments" aria-live="polite"></div>

    <div class="hud">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="timer">Time: <span id="timer">2:00</span></div>
    </div>

    <div id="board" aria-label="Game board"></div>

    <div id="gameOver" hidden>
        <div class="card">
            <h2>Time's up!</h2>
            <p>Your score: <strong id="finalScore">0</strong></p>
            <button id="playAgain" type="button">Play again</button>
        </div>
    </div>

    <audio id="crushSound" preload="auto">
        <source src="crush.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
